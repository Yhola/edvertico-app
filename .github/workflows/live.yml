name: Update live posts
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q cryptography
      - name: Pull and lock live data
        env:
          EDV_DATA_KEY: ${{ secrets.EDV_DATA_KEY }}
          NOTION_PAGE_ID: 40c6beaf8db58187bcdcf2c6b1e585d7
        run: python3 tools/pull_live.py
      - name: Commit if changed
        run: |
          git config user.name "edvertico-bot"
          git config user.email "edvertico-bot@users.noreply.github.com"
          git add live.enc.json live.sha
          git diff --cached --quiet || (git commit -m "Update live posts" && git push)
